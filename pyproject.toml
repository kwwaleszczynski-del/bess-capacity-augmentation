[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bess-capacity-augmentation"
version = "0.1.0"
description = "When does an ageing battery stop meeting its Polish capacity-market obligation, and what is the cheapest way to keep it: overbuild, augmentation, restricted operation or module replacement (LFP ageing model fitted to open cell data, arbitrage on PSE RCE prices)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Konrad Waleszczyński" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "pse-opendata>=0.2,<0.3",
    "plotly>=5.20",
    "kaleido>=0.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bess-augment = "bess_augment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bess_augment = ["resources/*.csv", "resources/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
